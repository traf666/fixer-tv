<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Решала ТВ · Fixer TV</title>
<meta name="description" content="Решала ТВ — бесплатный онлайн-кинотеатр для Android TV и ТВ-приставок: фильмы, сериалы, мультфильмы, аниме и торренты в одной программе, без рекламы.">
<style>
  :root { --bg:#0f141b; --fg:#e8edf3; --mut:#9aa7b4; --acc:#4c8bf5; --card:#161d27; --line:#2b3644; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:16px 16px 80px; }
  a { color:var(--acc); }
  img { max-width:100%; height:auto; border-radius:8px; }
  h1, h2 { border-bottom:1px solid var(--line); padding-bottom:6px; }
  h2 { margin-top:40px; }
  table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  blockquote { margin:16px 0; padding:8px 16px; border-left:4px solid var(--acc); background:var(--card); border-radius:6px; }
  code { background:var(--card); padding:2px 6px; border-radius:4px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:10px 0; padding:0 16px; }
  details[open] { padding-bottom:12px; }
  summary { cursor:pointer; padding:14px 0; font-size:19px; list-style-position:inside; }
  details[open] > summary { border-bottom:1px solid var(--line); margin-bottom:12px; }
  details.mig { box-shadow:0 0 0 3px var(--acc); }
  #up { position:fixed; right:18px; bottom:18px; width:52px; height:52px; border-radius:50%; border:0; background:var(--acc);
        color:#fff; font-size:26px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; }
  #up.on { opacity:1; pointer-events:auto; }
  #err { color:var(--mut); }
</style>
</head>
<body>
<main id="doc"><p id="err">…</p></main>
<button id="up" aria-label="up" title="">↑</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var en = new URLSearchParams(location.search).get("lang") === "en";
  document.documentElement.lang = en ? "en" : "ru";
  document.title = en ? "Fixer TV · Решала ТВ" : "Решала ТВ · Fixer TV";
  var up = document.getElementById("up");
  up.title = en ? "Back to top" : "Наверх";
  up.onclick = function () { window.scrollTo({ top: 0, behavior: "smooth" }); };
  window.addEventListener("scroll", function () { up.classList.toggle("on", window.scrollY > 600); }, { passive: true });

  // Раздел «Подробно»: якорь стоит перед своим спойлером — раскрыть его и показать.
  function otkryt(id, plavno) {
    var a = id && document.getElementById(id);
    if (!a) return false;
    var d = a.nextElementSibling || (a.parentElement && a.parentElement.tagName === "P" && a.parentElement.nextElementSibling);
    if (d && d.tagName === "DETAILS") {
      // Открыт только выбранный раздел, остальные свёрнуты (просьба хозяина 13.10.2026).
      document.querySelectorAll("details[open]").forEach(function (x) { if (x !== d) x.open = false; });
      d.open = true;
      d.classList.add("mig"); setTimeout(function () { d.classList.remove("mig"); }, 1500);
      a = d;
    }
    a.scrollIntoView({ behavior: plavno ? "smooth" : "auto", block: "start" });
    return true;
  }

  fetch(en ? "README.en.md" : "README.md", { cache: "no-cache" }).then(function (r) { return r.text(); }).then(function (md) {
    var doc = document.getElementById("doc");
    doc.innerHTML = marked.parse(md);
    // Ссылки страницы GitHub → эта страница.
    doc.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href");
      if (h === "README.md") a.setAttribute("href", "?lang=ru");
      else if (h === "README.en.md") a.setAttribute("href", "?lang=en");
      else if (/^(https?:)?\/\//.test(h) && !/traf666\.github\.io\/fixer-tv/.test(h)) a.target = "_blank";
    });
    // Кнопка «Удобная версия страницы» нужна только на GitHub.
    doc.querySelectorAll('a[href="https://traf666.github.io/fixer-tv/"], a[href="https://traf666.github.io/fixer-tv/?lang=en"]')
      .forEach(function (a) { var p = a.closest("p"); if (p) p.remove(); });
    // Пометки GitHub «> [!NOTE]» → обычная врезка со значком.
    doc.querySelectorAll("blockquote p").forEach(function (p) {
      p.innerHTML = p.innerHTML.replace(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br>)?/, function (m, k) {
        return ({ NOTE: "ℹ️ ", TIP: "💡 ", IMPORTANT: "❗ ", WARNING: "⚠️ ", CAUTION: "⛔ " })[k]; });
    });
    doc.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      var id = a.getAttribute("href").slice(1);
      if (id === "top") { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      if (document.getElementById(id)) { e.preventDefault(); history.replaceState(null, "", "#" + id); otkryt(id, true); }
    });
    if (location.hash) setTimeout(function () { otkryt(decodeURIComponent(location.hash.slice(1)), false); }, 50);
  }).catch(function () {
    document.getElementById("err").innerHTML = en
      ? 'Could not load the page. Open <a href="https://github.com/traf666/fixer-tv">github.com/traf666/fixer-tv</a>.'
      : 'Страница не загрузилась. Откройте <a href="https://github.com/traf666/fixer-tv">github.com/traf666/fixer-tv</a>.';
  });
})();
</script>
</body>
</html>
